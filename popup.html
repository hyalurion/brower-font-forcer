<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-border-strong: rgba(255, 255, 255, 0.2);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --success: #34d399;
            --danger: #f87171;
            --blur-amount: 24px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            width: 250px;
            font-family: system-ui, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 40%, #0f172a 100%);
            color: var(--text-primary);
            overflow: hidden;
            position: relative;
        }

        /* Ambient glow orbs */
        body::before {
            content: '';
            position: fixed;
            top: -60px;
            right: -40px;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -50px;
            left: -30px;
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, rgba(52, 211, 153, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            padding: 20px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Glass card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur-amount));
            -webkit-backdrop-filter: blur(var(--blur-amount));
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--glass-border-strong), transparent);
            opacity: 0.6;
            pointer-events: none;
        }

        /* Toggle row */
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .toggle-info {
            flex: 1;
            min-width: 0;
        }
        .toggle-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.3;
        }
        .toggle-desc {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
            line-height: 1.4;
        }

        /* Glass toggle switch */
        .toggle-switch {
            position: relative;
            width: 48px;
            height: 26px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
            outline: none;
        }
        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }
        .toggle-switch.active {
            background: linear-gradient(135deg, var(--accent), #7c3aed);
            border-color: transparent;
            box-shadow: 0 0 16px var(--accent-glow);
        }
        .toggle-switch.active::after {
            transform: translateX(22px);
            background: white;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
        }

        /* Status indicator */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 4px;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
            transition: all 0.3s ease;
            flex-shrink: 0;
        }
        .status-dot.inactive {
            background: var(--danger);
            box-shadow: 0 0 8px var(--danger);
        }
        .status-dot.excluded {
            background: #fbbf24;
            box-shadow: 0 0 8px rgba(251, 191, 36, 0.8);
        }
        .status-text {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="content">
        <!-- Toggle Card -->
        <div class="glass-card">
            <div class="toggle-row">
                <div class="toggle-info">
                    <div class="toggle-label" data-i18n="forceFont">Standardize Font</div>
                    <div class="toggle-desc" data-i18n="forceFontDesc">Enforce system font standards on web pages</div>
                </div>
                <button id="toggleBtn" class="toggle-switch active" role="switch" aria-checked="true" tabindex="0"></button>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusText" class="status-text">Font standardization enabled</span>
        </div>
    </div>

    <script src="blocked-sites.js"></script>
    <script src="popup.js"></script>
</body>
</html>
